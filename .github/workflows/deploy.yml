name: Daily Free-Tier Verify & Deploy

# 每日自动核验国内平台免费额度变化，并重建发布到 GitHub Pages。
# 两个任务，各自最小权限：
#   crawl  — 抓取第三方页面，唯一有 contents:write 的任务，负责提交数据快照
#   deploy — 只读 checkout + 发布 Pages，不接触第三方内容
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "app/**"
      - "components/**"
      - "package.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - ".github/workflows/deploy.yml"
  schedule:
    # 北京时间每天 06:17（UTC 22:17）自动核验，避开整点峰值
    - cron: "17 22 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 提交刷新后的数据快照
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 核验各平台免费额度
        env:
          CRAWL_TIMEOUT_MS: "15000"
        run: npm run crawl

      - name: 提交数据快照（best-effort）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/platforms.json data/changelog.json || true
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交。"
          else
            git commit -m "chore(data): refresh free-tier snapshot [skip ci]"
            git push || echo "提交跳过"
          fi

      - name: 上传快照给 deploy 任务
        uses: actions/upload-artifact@v4
        with:
          name: free-tier-snapshot
          path: data/
          retention-days: 1

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 使用最新核验快照
        uses: actions/download-artifact@v4
        with:
          name: free-tier-snapshot
          path: data/

      - name: 安装中文字体（页面渲染中文需要）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 构建静态站
        env:
          DATA_SOURCE: local
        run: npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5